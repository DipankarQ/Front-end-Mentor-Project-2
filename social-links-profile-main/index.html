<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <link rel="stylesheet" href="index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>


    <div class="container">
        <div class="user-image">
            <img src="./assets/images/avatar-jessica.jpeg" alt="user-image">
            <h1 class="name">Jessica Randall</h1>
            <br/>
            <p class="username">London, United Kingdom</p>
            
            <p class="Front">"Front-end developer and avid reader."</p>
        </div>

        <div class="links">
              <button class="link">GitHub</button>
              <button class="link">Frontend Mentor</button>
              <button class="link">LinkedIn</button>
              <button class="link">Twitter</button>
              <button class="link">Instagram</button>
        </div>
    </div>




  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
    Coded by <a href="#">Dipankar Dutta</a>.
  </div>
</body>
</html>
